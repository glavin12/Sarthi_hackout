services:
  data-service:
    build: ./data-service
    ports:
      - "8000:8000"
    environment:
      DATA_DB_PATH: /app/data.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/customers"]
      interval: 10s
      timeout: 5s
      retries: 3

  decision-engine:
    build: ./decision-engine
    ports:
      - "8001:8001"
    environment:
      DATA_SERVICE_URL: http://data-service:8000
    depends_on:
      data-service:
        condition: service_started

  nlp-service:
    build: ./nlp-service
    ports:
      - "8002:8002"
    environment:
      DATA_SERVICE_URL: http://data-service:8000
      DECISION_ENGINE_URL: http://decision-engine:8001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      - data-service
      - decision-engine

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DECISION_ENGINE_URL: http://localhost:8001
      NEXT_PUBLIC_NLP_SERVICE_URL: http://localhost:8002
      NEXT_PUBLIC_DATA_SERVICE_URL: http://localhost:8000
    depends_on:
      - decision-engine
      - nlp-service
