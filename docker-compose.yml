services:
  data-service:
    build: ./data-service
    ports:
      - "8000:8000"
    environment:
      DATA_DB_PATH: /app/data.db
    # No volume on purpose: recreating the container reseeds (the demo reset path).

  decision-engine:
    build: ./decision-engine
    ports:
      - "8001:8001"
    environment:
      DATA_SERVICE_URL: http://data-service:8000
    depends_on:
      - data-service

  nlp-service:
    build: ./nlp-service
    ports:
      - "8002:8002"
    environment:
      DATA_SERVICE_URL: http://data-service:8000
      DECISION_ENGINE_URL: http://decision-engine:8001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      - data-service

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* run in the browser → localhost, not docker service names.
      args:
        NEXT_PUBLIC_DATA_SERVICE_URL: http://localhost:8000
        NEXT_PUBLIC_DECISION_ENGINE_URL: http://localhost:8001
        NEXT_PUBLIC_NLP_URL: http://localhost:8002
    ports:
      - "3000:3000"
    depends_on:
      - data-service
      - decision-engine
      - nlp-service
